 do mês: moradia, mercado, contas, transporte, saúde. Fica de fora o que dá para cortar numa fase apertada.","- Renda estável (salário fixo): guarde 6 vezes esse custo.","- Renda que varia (autônomo, comissão, empresa própria): guarde 12 vezes.","No Kofra esses são os níveis Básico e Blindado. Você escolhe o nível e o app calcula a meta.","## Onde guardar","Reserva precisa estar disponível rápido e não pode perder valor quando você mais precisar dela. Por isso ela costuma ficar em aplicações de baixo risco e resgate imediato, e não em ações ou em investimentos com prazo de carência.","## Como montar sem sufoco","- Defina um valor fixo por mês e trate como uma conta a pagar.","- Registre cada aporte na tela Reserva de emergência: o guarda-chuva vai se abrindo conforme você avança.","- Usou a reserva? Registre o saque e volte a recompor aos poucos."].join(`
